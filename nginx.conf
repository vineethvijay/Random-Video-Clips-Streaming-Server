# This file is included inside the http{} block (conf.d/default.conf).
# nginx's default /etc/nginx/mime.types already maps m3u8 and ts correctly.

# Resolver for k8s DNS — needed so proxy_pass to the api Service is resolved
# at request time (not at config-load time) and survives api pod restarts.
resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

server {
    listen 8090;

    # Health check
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # HLS stream — ffmpeg in the api pod writes directly to /hls (shared RWX PVC).
    # Serve it here with no caching on the playlist, long cache on segments.
    location /live/ {
        alias /hls/;

        # Idle auto-pause: mirror every HLS request to the api so it can track
        # last-client-activity and shut ffmpeg down after IDLE_TIMEOUT_SEC of
        # silence. Mirror is fire-and-forget; the original response is not
        # delayed by the api.
        mirror /_hls_ping;
        mirror_request_body off;

        # Playlist: no cache, TV client must always re-fetch for live edge.
        location ~ \.m3u8$ {
            mirror /_hls_ping;
            mirror_request_body off;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Access-Control-Allow-Origin * always;
            expires -1;
        }

        # Segments: immutable, safe to cache for the segment lifetime.
        location ~ \.ts$ {
            mirror /_hls_ping;
            mirror_request_body off;
            add_header Cache-Control "public, max-age=60" always;
            add_header Access-Control-Allow-Origin * always;
        }

        add_header Access-Control-Allow-Origin * always;
    }

    # Internal endpoint hit by the `mirror` directive on every /live/ request.
    # Forwards a tiny GET to the api so it can refresh the idle timer.
    location = /_hls_ping {
        internal;
        access_log off;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 1s;
        proxy_read_timeout 1s;
        # Trailing URI is required so the resolver path is used. Service
        # name resolves via kube-dns (configured above).
        set $api_upstream "random-streamer-api.default.svc.cluster.local:8081";
        proxy_pass http://$api_upstream/api/_hls_ping;
    }

    # Flutter web UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
