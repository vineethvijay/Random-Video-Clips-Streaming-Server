name: random_video_streamer_client
description: Flutter client for Random Video Clips Streaming Server
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.3.0
  http: ^1.2.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2
  video_player_web_hls: ^1.3.0
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  lucide_icons: ^0.257.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
